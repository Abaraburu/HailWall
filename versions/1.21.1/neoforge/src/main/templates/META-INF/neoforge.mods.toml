modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Server-side mod whitelist/blacklist. On join it checks each player's client mods and kicks the ones that are not allowed (or that are missing a required mod). Install it on both the server and the client.'''
logoFile="icon.png"
authors="HailWall"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${loader_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
