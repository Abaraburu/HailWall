# NeoForge userdev (NeoForm decompile) needs more heap than a Fabric build.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
# Disabled for first-run robustness with the ModDevGradle plugin.
org.gradle.configuration-cache=false

# Environment — https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.233
loader_version_range=[1,)

# Mod Properties
mod_id=hailwall
mod_name=HailWall
mod_license=MIT
mod_version=1.0.3
mod_group_id=com.hailwall
# MC range this single jar supports (used for the jar file name). Keep in sync with
# minecraft_version_range above if you widen it. One jar can cover several versions.
mc_range=1.21.1
