# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Loom is not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false

# Fabric Properties — check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.16.14
loom_version=1.9.2

# Mod Properties
mod_version=1.0.3
maven_group=com.hailwall
# MC range this single jar supports (used for the jar file name). Keep in sync with
# fabric.mod.json "depends.minecraft" if you widen it. One jar can cover several versions.
mc_range=1.21-1.21.11

# Dependencies
fabric_api_version=0.116.12+1.21.1
